apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rke2-cluster-apps
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/aimlcloud/gitops-repo.git
        revision: main
        directories:
          - path: clusters/rke2-prod/apps/*/*
  template:
    metadata:
      name: '{{path.basename}}'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/aimlcloud/gitops-repo.git
        targetRevision: main
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

