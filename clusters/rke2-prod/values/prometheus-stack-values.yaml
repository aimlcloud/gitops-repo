prometheus:
  prometheusSpec:
    replicas: 2
    retention: 15d
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 1
        memory: 4Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
          storageClassName: longhorn
    # 👇 Add this to auto‑discover all rule files with label role=alert-rules
    ruleSelector:
      matchLabels:
        role: alert-rules
    ruleNamespaceSelector: {}
    ruleNamespace: "monitoring"

alertmanager:
  alertmanagerSpec:
    replicas: 2
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    # 👇 Reference your Alertmanager config ConfigMap
    configMaps:
      - alertmanager-config

