replicas: 2

persistence:
  enabled: true
  size: 10Gi
  storageClassName: longhorn

adminUser: admin
adminPassword: changeme

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-stack-prometheus:9090
        access: proxy
        isDefault: true
      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy

dashboardsProvider:
  enabled: true
  configMaps:
    - grafana-dashboards

