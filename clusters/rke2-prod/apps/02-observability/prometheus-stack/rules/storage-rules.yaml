apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: storage-rules
  namespace: monitoring
  labels:
    role: alert-rules
spec:
  groups:
  - name: storage-health
    rules:
    - alert: PVCStorageFull
      expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes < 0.1
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "PVC storage nearly full"
        description: "PersistentVolumeClaim has less than 10% free space."

    - alert: HighDiskIO
      expr: rate(node_disk_io_time_seconds_total[5m]) > 0.8
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "High disk IO on {{ $labels.instance }}"
        description: "Disk IO time >80% for 10 minutes."

    - alert: DiskReadErrors
      expr: rate(node_disk_read_errors_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Disk read errors on {{ $labels.instance }}"
        description: "Read errors detected on disk device."

    - alert: DiskWriteErrors
      expr: rate(node_disk_write_errors_total[5m]) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Disk write errors on {{ $labels.instance }}"
        description: "Write errors detected on disk device."

