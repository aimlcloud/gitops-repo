apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.yourmailserver.com:587
      smtp_from: alerts@yourdomain.com
      smtp_auth_username: alerts@yourdomain.com
      smtp_auth_password: YOUR_SMTP_PASSWORD

    route:
      group_by: ['alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'email-team'
      routes:
        - match:
            severity: critical
          receiver: 'email-team'

    receivers:
      - name: 'email-team'
        email_configs:
          - to: ops@yourdomain.com
            send_resolved: true

