apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: rke2-namespaces
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: monitoring
          - name: observability
          - name: traefik
          - name: cert-manager
          - name: falco
          - name: kyverno
          - name: trivy-system
          - name: longhorn
          - name: velero
          - name: external-secrets
          - name: keycloak
          - name: audit-logs
  template:
    metadata:
      name: '{{name}}-ns'
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "-1"   # ensure namespaces are created first
    spec:
      project: default
      source:
        repoURL: https://github.com/aimlcloud/gitops-repo.git
        targetRevision: main
        # inline manifest for namespace creation
        directory:
          recurse: false
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{name}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true

